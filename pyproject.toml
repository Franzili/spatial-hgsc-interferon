[project]
name = "spatial-hgsc-interferon"
version = "0.1.0"
description = "Analysis code for the Visium spatial transcriptomics study of high-grade serous carcinoma, titled 'Spatial transcriptomics reveals interferon pathway enrichment in early relapsing serous carcinoma'"
authors = [
    {name = "Franziska Niemeyer"},
]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "decoupler>=2.1.6,<3.0.0",
    "ipykernel>=7.2.0,<8.0.0",
    "aquarel>=0.0.7,<0.0.8",
    "cmcrameri>=1.9,<2.0",
    "scanpy>=1.12.1,<2.0.0",
    "squidpy>=1.8.1,<2.0.0",
    "matplotlib>=3.10.9,<4.0.0",
    "esda>=2.9.0,<3.0.0",
    "libpysal>=4.14.1,<5.0.0",
    "seaborn>=0.13.2,<0.14.0",
    "scipy>=1.17.1,<2.0.0",
    "pydeseq2>=0.5.4,<0.6.0",
    "cell2cell>=0.8.4,<0.9.0",
    "cell2location>=0.1.5,<0.2.0",
    "igraph>=1.0.0,<2.0.0",
    "leidenalg>=0.11.0",
    "jupyterlab>=4.6.2",
    "jupyter>=1.1.1",
    "scikit-posthocs>=0.16.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cnv_inference"]
